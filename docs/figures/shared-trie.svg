<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 385" role="img" aria-labelledby="title desc"><title id="title">Three version roots sharing actual trie nodes</title><desc id="desc">Versions3,4,5 have distinct roots; common leaf IDs are one physical node identity each. The updated beta leaf is separate.</desc><rect width="100%" height="100%" fill="#fffaf1"/><g font-family="ui-monospace,monospace" fill="#27251f"><path d="M180 112 C180 170 540 185 540 252" stroke="#6a6760" stroke-width="2" fill="none" opacity=".75"/><path d="M180 112 C180 170 325 185 325 252" stroke="#6a6760" stroke-width="2" fill="none" opacity=".75"/><path d="M180 112 C180 170 110 185 110 252" stroke="#6a6760" stroke-width="2" fill="none" opacity=".75"/><path d="M545 112 C545 170 540 185 540 252" stroke="#c05a2a" stroke-width="2" fill="none" opacity=".75"/><path d="M545 112 C545 170 755 185 755 252" stroke="#c05a2a" stroke-width="2" fill="none" opacity=".75"/><path d="M545 112 C545 170 110 185 110 252" stroke="#c05a2a" stroke-width="2" fill="none" opacity=".75"/><path d="M910 112 C910 170 540 185 540 252" stroke="#247c70" stroke-width="2" fill="none" opacity=".75"/><path d="M910 112 C910 170 325 185 325 252" stroke="#247c70" stroke-width="2" fill="none" opacity=".75"/><path d="M910 112 C910 170 970 185 970 252" stroke="#247c70" stroke-width="2" fill="none" opacity=".75"/><path d="M910 112 C910 170 110 185 110 252" stroke="#247c70" stroke-width="2" fill="none" opacity=".75"/><rect x="85" y="48" width="190" height="64" rx="3" fill="#fff" stroke="#6a6760" stroke-width="2"/><text x="180" y="75" text-anchor="middle" font-size="17">v3 → node #3</text><text x="180" y="98" text-anchor="middle" font-size="11">bitmap 40010080</text><rect x="450" y="48" width="190" height="64" rx="3" fill="#fff" stroke="#c05a2a" stroke-width="2"/><text x="545" y="75" text-anchor="middle" font-size="17">v4 → node #5</text><text x="545" y="98" text-anchor="middle" font-size="11">bitmap 40010080</text><rect x="815" y="48" width="190" height="64" rx="3" fill="#fff" stroke="#247c70" stroke-width="2"/><text x="910" y="75" text-anchor="middle" font-size="17">v5 → node #7</text><text x="910" y="98" text-anchor="middle" font-size="11">bitmap 41010080</text><rect x="25" y="252" width="170" height="60" fill="#fff" stroke="#9c9689"/><text x="110" y="276" text-anchor="middle" font-size="15">alpha = 1</text><text x="110" y="298" text-anchor="middle" font-size="12">identity #0</text><rect x="240" y="252" width="170" height="60" fill="#fff" stroke="#9c9689"/><text x="325" y="276" text-anchor="middle" font-size="15">beta = 2</text><text x="325" y="298" text-anchor="middle" font-size="12">identity #2</text><rect x="455" y="252" width="170" height="60" fill="#fff" stroke="#9c9689"/><text x="540" y="276" text-anchor="middle" font-size="15">gamma = 3</text><text x="540" y="298" text-anchor="middle" font-size="12">identity #4</text><rect x="670" y="252" width="170" height="60" fill="#fff" stroke="#9c9689"/><text x="755" y="276" text-anchor="middle" font-size="15">beta = 20</text><text x="755" y="298" text-anchor="middle" font-size="12">identity #6</text><rect x="885" y="252" width="170" height="60" fill="#fff" stroke="#9c9689"/><text x="970" y="276" text-anchor="middle" font-size="15">delta = 4</text><text x="970" y="298" text-anchor="middle" font-size="12">identity #8</text><text x="35" y="365" font-size="12" fill="#6a6760">Colors identify version roots; each leaf box represents one shared object identity, not a copied value.</text></g></svg>
