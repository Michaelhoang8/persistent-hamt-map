<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 435" role="img" aria-labelledby="title desc"><title id="title">Branching immutable version history</title><desc id="desc">The trace forks from version3. Versions7 and8 are no-ops retaining the exact root; version6 descends from version4.</desc><rect width="100%" height="100%" fill="#fffaf1"/><g font-family="ui-monospace,monospace" fill="#27251f"><path d="M101 210 L174 210" stroke="#a39a8b" stroke-width="2" fill="none"/><path d="M236 210 L309 210" stroke="#a39a8b" stroke-width="2" fill="none"/><path d="M371 210 L444 210" stroke="#a39a8b" stroke-width="2" fill="none"/><path d="M506 210 L659 65" stroke="#a39a8b" stroke-width="2" fill="none"/><path d="M506 210 L659 165" stroke="#a39a8b" stroke-width="2" fill="none"/><path d="M506 210 L659 265" stroke="#a39a8b" stroke-width="2" fill="none"/><path d="M506 210 L659 365" stroke="#a39a8b" stroke-width="2" fill="none"/><path d="M721 65 L939 65" stroke="#a39a8b" stroke-width="2" fill="none"/><circle cx="70" cy="210" r="28" fill="#fff" stroke="#27251f" stroke-width="2"/><text x="70" y="216" text-anchor="middle" font-size="17">v0</text><text x="70" y="258" text-anchor="middle" font-size="11">empty</text><circle cx="205" cy="210" r="28" fill="#fff" stroke="#27251f" stroke-width="2"/><text x="205" y="216" text-anchor="middle" font-size="17">v1</text><text x="205" y="258" text-anchor="middle" font-size="11">alpha=1</text><circle cx="340" cy="210" r="28" fill="#fff" stroke="#27251f" stroke-width="2"/><text x="340" y="216" text-anchor="middle" font-size="17">v2</text><text x="340" y="258" text-anchor="middle" font-size="11">beta=2</text><circle cx="475" cy="210" r="28" fill="#fff" stroke="#27251f" stroke-width="2"/><text x="475" y="216" text-anchor="middle" font-size="17">v3</text><text x="475" y="258" text-anchor="middle" font-size="11">gamma=3</text><circle cx="690" cy="65" r="28" fill="#fff" stroke="#c05a2a" stroke-width="2"/><text x="690" y="71" text-anchor="middle" font-size="17">v4</text><text x="690" y="113" text-anchor="middle" font-size="11">beta=20</text><circle cx="690" cy="165" r="28" fill="#fff" stroke="#27251f" stroke-width="2"/><text x="690" y="171" text-anchor="middle" font-size="17">v5</text><text x="690" y="213" text-anchor="middle" font-size="11">delta=4</text><circle cx="690" cy="265" r="28" fill="#fff" stroke="#247c70" stroke-width="2"/><text x="690" y="271" text-anchor="middle" font-size="17">v7</text><text x="690" y="313" text-anchor="middle" font-size="11">remove absent</text><circle cx="690" cy="365" r="28" fill="#fff" stroke="#247c70" stroke-width="2"/><text x="690" y="371" text-anchor="middle" font-size="17">v8</text><text x="690" y="413" text-anchor="middle" font-size="11">beta=2 again</text><circle cx="970" cy="65" r="28" fill="#fff" stroke="#c05a2a" stroke-width="2"/><text x="970" y="71" text-anchor="middle" font-size="17">v6</text><text x="970" y="113" text-anchor="middle" font-size="11">remove alpha</text></g></svg>
